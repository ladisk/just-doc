<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>just-doc</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #525659; font: 12px/22px system-ui, sans-serif; }
  #tabs { display: flex; height: 22px; background: #2b2d30; color: #a9adb3; user-select: none; }
  .tab { padding: 0 12px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
         border-right: 1px solid #45484d; }
  .tab.on { background: #525659; color: #fff; }
  .tab i { font-style: normal; background: #1f8f4e; color: #fff; border-radius: 8px; padding: 0 6px; margin-right: 6px; font-size: 11px; }
  .tab b { background: #2f7bff; color: #fff; border-radius: 8px; padding: 0 6px; margin-left: 6px; font-size: 11px; }
  #keys { margin-left: auto; padding: 0 10px; white-space: nowrap; }
  kbd { font: 11px ui-monospace, monospace; background: #45484d; color: #e8e8e8; border-radius: 3px; padding: 0 4px; }
  iframe { position: absolute; left: 0; top: 22px; width: 100%; height: calc(100% - 22px); border: 0; visibility: hidden; }
  iframe.on { visibility: visible; }
  #toast { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); z-index: 40; background: #1f7a3a; color: #fff;
           padding: 10px 18px; border-radius: 6px; font-size: 15px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none; }
  #toast.err { background: #b00020; }
  /* one document needs no tab bar */
  body.one #tabs { display: none; }
  body.one iframe { top: 0; height: 100%; }
</style>
</head>
<body class="one">
<div id="tabs"></div>
<div id="toast"></div>
<script>
// The window: one tab per open document. Each document is a full viewer in its own frame,
// so it keeps its page, zoom, cursor and search while another tab is shown.
const bar = document.getElementById('tabs');
const frames = {};   // document id -> iframe
let tabs = [], active = null;
const revs = {};     // document id -> the state of its comments that its viewer shows
const news = {};     // document id -> the number of its comments with a new reply
const files = {};    // document id -> the state of its file that its viewer shows
const waits = {};    // document id -> whether a just-doc --wait waits for it
window.tabWaiting = id => waits[id];
const pending = {};  // document id -> whether a Ctrl+Enter in it was not taken by a --wait yet
window.tabPending = id => pending[id];
let opened = +(sessionStorage.getItem('opened') || -1);   // the last "open" request that was shown

function show(id) {
  if (!frames[id]) return;
  active = id;
  sessionStorage.setItem('tab', id);
  for (const k in frames) frames[k].classList.toggle('on', k === id);
  frames[id].contentWindow.focus();
  draw();
}

// the viewers report their new replies; the sum goes into the title, where the task bar shows it
const done = {};     // document id -> whether the assistant finished its answers and waits again
window.tabNews = (id, n, ready) => { news[id] = n; done[id] = ready; draw(); };

function draw() {
  bar.textContent = '';
  for (const t of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === active ? ' on' : '');
    el.textContent = t.name;
    // a page shown live, with its scripts running: no comments there
    if (t.live) { const i = document.createElement('i'); i.textContent = 'live'; el.prepend(i); }
    if (news[t.id]) { const b = document.createElement('b'); b.textContent = (done[t.id] ? '✓ ' : '') + news[t.id]; el.appendChild(b); }
    el.title = t.path + (t.live ? ' (live page, loaded again when the file changes; no comments)' : '');
    el.onclick = () => show(t.id);
    bar.appendChild(el);
  }
  const keys = document.createElement('div');
  keys.id = 'keys';
  keys.innerHTML = '<kbd>H</kbd>/<kbd>L</kbd> tab &nbsp;<kbd>Ctrl</kbd> <kbd>w</kbd> close';
  bar.appendChild(keys);
  // the bar also shows for a single live page, so that its marker is seen
  document.body.classList.toggle('one', tabs.length < 2 && !tabs.some(t => t.live));
  const all = tabs.reduce((sum, t) => sum + (news[t.id] || 0), 0), shown = tabs.find(t => t.id === active);
  const ready = tabs.some(t => done[t.id]);
  if (shown) document.title = (ready ? '✓ ' : '') + (all ? `(${all}) ` : '') + shown.name + ' – just-doc';
}

// the server sends the list of documents when it changes
function sync(msg) {
  if (msg.quit) {
    // q was pressed in a window: just-doc stops. A window that the browser does not let
    // close itself says so.
    window.close();
    document.body.textContent = 'just-doc was stopped; this window can be closed.';
    return;
  }
  const at = tabs.findIndex(t => t.id === active);
  tabs = msg.tabs;
  for (const t of tabs) {
    if (frames[t.id]) continue;
    const f = frames[t.id] = document.createElement('iframe');
    // a live page comes from its own folder, so that its relative links work
    // a page of another machine comes through the server here (t.src, /remote/)
    f.src = t.src || (t.live ? `live/${t.id}/${encodeURIComponent(t.name)}` : 'view?d=' + t.id);
    f.onload = () => {
      if (t.live) livePage(f, t);
      if (active === t.id) f.contentWindow.focus();
    };
    document.body.appendChild(f);
  }
  // comments that were changed from outside (a reply): the viewer reads them again
  for (const t of tabs) {
    if (t.id in revs && revs[t.id] !== t.rev) frames[t.id].contentWindow.reloadAnnots?.();
    revs[t.id] = t.rev;
    // the file itself was changed: load the document again
    if (t.id in files && files[t.id] !== t.file) {
      const w = frames[t.id].contentWindow;
      // a live page keeps its scroll position
      if (t.live) frames[t.id].dataset.scroll = JSON.stringify([w.scrollX, w.scrollY]);
      w.location.reload();
    }
    files[t.id] = t.file;
    if (t.live) continue;
    if (waits[t.id] !== t.waiting || pending[t.id] !== t.pending) {
      waits[t.id] = t.waiting;
      pending[t.id] = t.pending;
      frames[t.id].contentWindow.showNews?.();
    }
  }
  for (const id in frames) if (!tabs.some(t => t.id === id)) { frames[id].remove(); delete frames[id]; }
  if (!tabs.length) { draw(); return; }
  if (msg.opened !== opened) {
    opened = msg.opened;
    sessionStorage.setItem('opened', opened);
    show(msg.focus);
  }
  if (frames[active]) draw();
  else {
    // the tab that was shown is closed (or the window was reloaded), or the document that was
    // opened last is closed again: take the tab from before, or a neighbour
    const kept = sessionStorage.getItem('tab');
    show(frames[kept] ? kept : tabs[Math.min(Math.max(at, 0), tabs.length - 1)].id);
  }
}

function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = err ? 'err' : '';
  el.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.style.display = 'none', err ? 8000 : 4000);
}

// The answers of a live page: every field with a name. A single checkbox is true or false, checkboxes
// that share a name give the list of the checked values, radios the chosen value (null: none), a
// select with several choices a list.
function answers(d) {
  const out = {}, els = [...d.querySelectorAll('input[name], textarea[name], select[name]')];
  const boxes = {};
  for (const el of els) if (el.type === 'checkbox') boxes[el.name] = (boxes[el.name] || 0) + 1;
  for (const el of els) {
    const n = el.name;
    if (['button', 'submit', 'reset', 'image', 'file'].includes(el.type)) continue;
    if (el.type === 'checkbox') {
      if (boxes[n] > 1) { out[n] = out[n] || []; if (el.checked) out[n].push(el.value); }
      else out[n] = el.checked;
    } else if (el.type === 'radio') {
      if (!(n in out)) out[n] = null;
      if (el.checked) out[n] = el.value;
    } else if (el.tagName === 'SELECT' && el.multiple) out[n] = [...el.selectedOptions].map(o => o.value);
    else out[n] = el.value;
  }
  return out;
}

// Ctrl+Enter in a live page hands its answers over, as in a viewer; a page of another machine
// keeps them there, through /remote/
async function handOver(t, d) {
  const url = t.remote ? `remote/${t.id}/api/answers?d=${t.rid}` : `api/answers?d=${t.id}`;
  const got = answers(d), n = Object.keys(got).length;
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers: got }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    toast(!j.listening ? 'Handed over, but nobody is waiting yet: start just-doc with --live --wait'
          : n ? `Handed over ${n} answer(s)` : 'Handed over, but the page has no named fields');
  } catch (e) { toast('Not handed over: ' + (e.message || 'the server is not responding'), true); }
}

// A live page has the keyboard for itself, except for Ctrl+Enter (hand over the answers),
// Alt+Left / Alt+Right, Ctrl+w, and H / L outside a text field; those change or close the tab
// as in a viewer. A form in it is not sent anywhere.
function livePage(f, t) {
  const w = f.contentWindow;
  if (f.dataset.scroll) { w.scrollTo(...JSON.parse(f.dataset.scroll)); delete f.dataset.scroll; }
  w.addEventListener('submit', e => e.preventDefault(), true);
  w.addEventListener('keydown', e => {
    if (e.ctrlKey && !e.altKey && e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); handOver(t, w.document); return; }
    const typing = e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '');
    const key = !typing && !e.ctrlKey && !e.altKey && (e.key === 'H' || e.key === 'L') ? (e.key === 'H' ? 'ArrowLeft' : 'ArrowRight')
              : e.altKey && !e.ctrlKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') ? e.key
              : e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'w' ? 'w' : '';
    if (key && window.tabKey(key)) { e.preventDefault(); e.stopPropagation(); }
  }, true);
}

// Left / Right change the tab and w closes it; the viewers pass their tab keys on as these.
// Returns true when the key was used.
window.tabKey = key => {
  const at = tabs.findIndex(t => t.id === active);
  if (key === 'ArrowLeft' || key === 'ArrowRight') {
    if (tabs.length > 1) show(tabs[(at + (key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length].id);
    return true;
  }
  if (key === 'w' || key === 'W') {
    if (tabs.length > 1) fetch('api/close?d=' + active, { method: 'POST' });
    return true;
  }
  return false;
};
// the same keys while the tab bar itself has the keyboard
document.addEventListener('keydown', e => {
  const key = !e.ctrlKey && !e.altKey && (e.key === 'H' || e.key === 'L') ? (e.key === 'H' ? 'ArrowLeft' : 'ArrowRight')
            : (e.altKey && !e.ctrlKey) || (e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'w') ? e.key : '';
  if (key && window.tabKey(key)) e.preventDefault();
});
window.addEventListener('focus', () => { if (frames[active]) frames[active].contentWindow.focus(); });

new EventSource('api/events').onmessage = e => sync(JSON.parse(e.data));
</script>
</body>
</html>
