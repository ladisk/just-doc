[project]
name = "just-doc"
version = "0.1.0"
description = "Highlight and comment a PDF with single keys; comments are saved as JSON with the exact text and position."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pypdf>=4"]

[project.scripts]
just-doc = "just_doc:main"

[project.urls]
Repository = "https://github.com/ladisk/just-doc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["just_doc"]
